# Production overrides.
#
# Usage:
#   API_BASE_URL=https://api.example.com/api/v1 \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      args:
        API_BASE_URL: ${API_BASE_URL:?API_BASE_URL must be set in prod}
    ports:
      # Only loopback: a reverse proxy (nginx/traefik/caddy) fronts it.
      - "127.0.0.1:8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
