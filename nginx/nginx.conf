worker_processes 2;
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression ───
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
    text/css
    text/javascript
    text/plain
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml;

    # ─── Security headers ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Long cache for hashed static assets ───
    # Flutter emits content-hashed filenames for JS/WASM/fonts.
    # 1 year + immutable is safe.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── No cache for the SPA entry point ───
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # ─── SPA fallback: any unknown path → index.html (go_router handles it) ───
    location / {
        try_files $uri $uri/ /index.html;
    }
}